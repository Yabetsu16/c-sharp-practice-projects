name: ASP.NET Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore project_1.Tests/project_1.Tests.csproj

      - name: Build API
        run: dotnet build project_1/project_1.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test project_1.Tests/project_1.Tests.csproj --configuration Release
