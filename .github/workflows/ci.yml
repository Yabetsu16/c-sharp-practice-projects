name: ASP.NET Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore project_1.Tests/project_1.Tests.csproj

      - name: Build API
        run: dotnet build project_1/project_1.csproj --configuration Release --no-restore

      - name: Run integration tests
        run: dotnet test project_1.Tests/project_1.Tests.csproj --configuration Release

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./project_1
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/yabetsu16/c-sharp-practice-projects:latest
            ghcr.io/yabetsu16/c-sharp-practice-projects:${{ github.sha }}
